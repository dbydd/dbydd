name: Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Languages with org affiliations
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/diag-a.svg
          output_action: none
          template: classic
          debug: yes
          repositories_affiliations: owner, collaborator, organization_member
          base: ""
          plugin_languages: yes

      - name: Languages owner only
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/diag-b.svg
          output_action: none
          template: classic
          debug: yes
          base: ""
          plugin_languages: yes
