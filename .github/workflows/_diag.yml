name: Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: A orgs batch40
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/diag-a.svg
          output_action: none
          template: classic
          debug: yes
          repositories: 40
          repositories_batch: 40
          repositories_affiliations: owner, collaborator, organization_member
          base: ""
          plugin_languages: yes

      - name: B orgs batch25
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/diag-b.svg
          output_action: none
          template: classic
          debug: yes
          repositories: 25
          repositories_batch: 25
          repositories_affiliations: owner, collaborator, organization_member
          base: ""
          plugin_languages: yes

      - name: C owner batch40
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/diag-c.svg
          output_action: none
          template: classic
          debug: yes
          repositories: 40
          repositories_batch: 40
          base: ""
          plugin_languages: yes

      - name: D orgs batch100
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/diag-d.svg
          output_action: none
          template: classic
          debug: yes
          repositories: 100
          repositories_batch: 100
          repositories_affiliations: owner, collaborator, organization_member
          base: ""
          plugin_languages: yes
