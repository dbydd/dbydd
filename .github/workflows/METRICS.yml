name: Metrics

on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Every card renders with output_action: none, which drops the SVG in
      # /metrics_renders/<filename> on the runner instead of committing it.
      # One publish step then commits the whole set as a single commit.
      #
      # repositories_affiliations widens every card past personal repos so the
      # org work under arceos-usb, M-F-R-F and teacon2021-MFRF is counted too.
      #
      # Cards are chosen from plugins that read the REST/GraphQL repo, commit
      # and search APIs. Plugin activity and plugin habits are deliberately
      # absent: both dereference payload.commits on PushEvent, which the
      # GitHub events API no longer returns, so they render "Unexpected error".
      # Plugin achievements is absent for the same reason (its GraphQL query
      # still asks for the sunset Projects classic field).
      - name: Profile summary
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/metrics.base.svg
          output_action: none
          repositories_affiliations: owner, collaborator, organization_member
          template: classic
          config_timezone: Etc/GMT-8
          config_animations: yes
          config_display: large
          base: header, community, repositories

      - name: Activity and lines
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/metrics.activity.svg
          output_action: none
          repositories_affiliations: owner, collaborator, organization_member
          template: classic
          config_timezone: Etc/GMT-8
          config_animations: yes
          config_display: large
          base: ""
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/metrics.languages.svg
          output_action: none
          repositories_affiliations: owner, collaborator, organization_member
          template: classic
          config_timezone: Etc/GMT-8
          config_animations: yes
          config_display: large
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_ignored: ZenScript, TeX, HTML, CSS
          plugin_languages_limit: 16
          plugin_languages_other: yes
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/metrics.calendar.svg
          output_action: none
          repositories_affiliations: owner, collaborator, organization_member
          template: classic
          config_timezone: Etc/GMT-8
          config_animations: yes
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Notable contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dbydd
          filename: assets/metrics.notable.svg
          output_action: none
          repositories_affiliations: owner, collaborator, organization_member
          template: classic
          config_timezone: Etc/GMT-8
          config_animations: yes
          config_display: large
          base: ""
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_indepth: yes
          plugin_notable_self: no
          plugin_stars: yes
          plugin_stars_limit: 4

      - name: Publish cards
        if: always()
        run: |
          set -euo pipefail
          sudo mkdir -p assets
          sudo cp -f /metrics_renders/assets/*.svg assets/ 2>/dev/null || echo "no cards were rendered"
          sudo chown -R "$(id -u):$(id -g)" assets
          sudo rm -rf /metrics_renders
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "cards unchanged"
            exit 0
          fi
          git commit -m "chore(profile): refresh generated cards [skip ci]"
          git push origin HEAD
